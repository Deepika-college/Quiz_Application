spring.application.name=api-gateway
server.port=8765

# Eureka Client configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Route for direct /quiz/** endpoint
spring.cloud.gateway.server.webmvc.routes[0].id=quiz-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://QUIZ-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/quiz/**

# Route for service-prefixed /quiz-service/** endpoint (with StripPrefix filter)
spring.cloud.gateway.server.webmvc.routes[1].id=quiz-service-prefixed
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://QUIZ-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/quiz-service/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

# Route for Question Service (/Question/**)
spring.cloud.gateway.server.webmvc.routes[2].id=question-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://QUESTION-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/Question/**

# Route for Question Service lowercase (/question/** mapped to /Question/**)
spring.cloud.gateway.server.webmvc.routes[3].id=question-service-lowercase
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://QUESTION-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/question/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=RewritePath=/question/(?<segment>.*), /Question/${segment}

# Route for service-prefixed /question-service/** endpoint
spring.cloud.gateway.server.webmvc.routes[4].id=question-service-prefixed
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://QUESTION-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/question-service/**
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=StripPrefix=1

# Logging to inspect route matching and load balancing
logging.level.org.springframework.cloud.gateway.server.mvc=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG

